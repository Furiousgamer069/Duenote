name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # No API key and no network calls: core logic, sample replay and simulated provider failures
      - run: python -m pytest -q
      - run: python skills/duenote/scripts/balances.py skills/duenote/scripts/example_entries.json
